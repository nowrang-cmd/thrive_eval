name: THRiVE Pay Now Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pay-now-smoke-test.yml'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Submit Pay Now test registration
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS \
            -X POST 'https://thrive-eval.vercel.app/api/evaluation-registration' \
            -H 'Content-Type: application/json' \
            --data '{"athleteFirstName":"THRiVE","athleteLastName":"PAYNOW TEST","dateOfBirth":"2012-05-15","grade":"Grade 9","position":"Guard","school":"Smoke Test","athleteEmail":"thrive-paynow-athlete-test@thrivebasketball.org","parentFirstName":"THRiVE","parentLastName":"TEST","parentEmail":"thrive-paynow-parent-test@thrivebasketball.org","parentPhone":"204-555-0199","yearsExperience":"3","highestLevelPlayed":"Test","improvementGoals":"Smoke test only","notes":"Automated Pay Now smoke test; safe to delete","paymentChoice":"online","consent":true,"website":""}')
          echo "$response"
          echo "$response" | grep -q '"ok":true'
          echo "$response" | grep -q '"paymentChoice":"online"'
          echo "$response" | grep -q 'https://buy.stripe.com/4gM8wP8sNcoXdz270P2400i'
          echo "$response" | grep -q 'client_reference_id='
